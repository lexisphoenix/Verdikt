packages:
  - "apps/*"
  - "packages/*"
  - "bench"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: set this to true or false
  sharp: true
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - playwright-core@1.62.0
  - playwright@1.62.0
